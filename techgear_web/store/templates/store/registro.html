{% extends "store/base.html" %}

{% block titulo %}Crear cuenta - TechGear{% endblock %}

{% block contenido %}
<section class="acceso">
  <div class="acceso-texto">
    <h1>Crea tu cuenta</h1>
    <p>Con una cuenta puedes hacer pedidos. Las cuentas nuevas son de usuario normal.</p>
  </div>

  <form class="formulario" method="post" action="{% url 'registro' %}">
    {% csrf_token %}

    <label class="campo">Nombre
      <input type="text" name="nombre" value="{{ nombre }}" required minlength="2" maxlength="100" autocomplete="name">
    </label>
    <label class="campo">Correo electrónico
      <input type="email" name="email" value="{{ email }}" required autocomplete="email">
    </label>
    <label class="campo">Contraseña
      <input type="password" name="password" required minlength="8" autocomplete="new-password">
      <span class="ayuda">Mínimo 8 caracteres.</span>
    </label>
    <label class="campo">Repite la contraseña
      <input type="password" name="password2" required minlength="8" autocomplete="new-password">
    </label>

    <button class="btn btn-solido btn-ancho" type="submit">Crear cuenta</button>
    <p class="nota">¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a>.</p>
  </form>
</section>
{% endblock %}
